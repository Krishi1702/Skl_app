name: CI/CD

on:
  push:
    branches: [Phase1]
  pull_request:
    branches: [Phase1]
  workflow_dispatch:

# Never let two deploys touch the server at once. Queue instead of cancelling,
# so a half-applied deploy is never abandoned mid-flight.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ── 1. Lint + backend tests ────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    # Runs inside a container so service containers are reachable by hostname
    # ("postgres", "redis") — which is exactly what tests/conftest.py hardcodes.
    container: python:3.11-slim
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_erp_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libpq-dev
          rm -rf /var/lib/apt/lists/*

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        # Advisory for now: app/ currently has ~267 pre-existing violations
        # (mostly E501 line-length and I001 import order). Blocking on them would
        # fail every build. Clear the backlog with `ruff check app/ --fix`, then
        # drop this line to make lint a real gate.
        continue-on-error: true
        run: ruff check app/

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/school_erp_test
          REDIS_URL: redis://redis:6379
        run: |
          # tests/ currently holds only conftest.py — pytest exits 5 ("no tests
          # collected") which would fail the build. Skip cleanly until real
          # test files land, then this runs them automatically.
          if compgen -G "tests/test_*.py" > /dev/null; then
            pytest tests/ -v --tb=short
          else
            echo "::warning::No test files found under backend/tests/ — skipping pytest."
          fi
        shell: bash

  # ── 2. Build & push images to GHCR ─────────────────────────────────────────
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            target: ""
          - name: frontend
            context: ./frontend
            target: runner
          - name: ai-service
            context: ./ai-service
            target: ""
          - name: nginx
            context: ./nginx
            target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ── 3. Deploy to the VPS ───────────────────────────────────────────────────
  deploy:
    needs: build
    if: github.ref == 'refs/heads/Phase1' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      APP_DIR: ${{ secrets.APP_DIR || '/opt/skl_app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — verify secrets are visible to this job
        # Reports presence/length only. Never prints a secret value.
        run: |
          missing=0
          # Required: absence fails the job.
          req() {
            if [ -z "$2" ]; then
              echo "  MISSING  $1"
              missing=1
            else
              echo "  ok       $1  (${#2} chars)"
            fi
          }
          # Optional: absence is fine — report the fallback and move on.
          opt() {
            if [ -z "$2" ]; then
              echo "  unset    $1  -> using default: $3"
            else
              echo "  ok       $1  (${#2} chars)"
            fi
          }
          echo "Required:"
          req SSH_HOST        "${{ secrets.SSH_HOST }}"
          req SSH_USER        "${{ secrets.SSH_USER }}"
          req SSH_PRIVATE_KEY "${{ secrets.SSH_PRIVATE_KEY }}"
          echo "Optional:"
          opt SSH_PORT        "${{ secrets.SSH_PORT }}"        "22"
          opt APP_DIR         "${{ secrets.APP_DIR }}"         "/opt/skl_app"
          opt SSH_KNOWN_HOSTS "${{ secrets.SSH_KNOWN_HOSTS }}" "ssh-keyscan (trust on first use)"
          if [ "$missing" = "1" ]; then
            echo "::error::A required secret is empty or not visible to this job."
            echo "This job runs with 'environment: production', so it can read"
            echo "repository secrets AND secrets on the 'production' environment."
            echo "If a secret looks set in the UI but reads empty here, check:"
            echo "  - the NAME matches exactly (case-sensitive, no trailing space)"
            echo "  - it is a SECRET, not a VARIABLE (different tab, vars.* not secrets.*)"
            echo "  - it is on THIS repo, not a fork or another environment"
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Strip CR (keys pasted from Windows carry CRLF, which makes OpenSSH
          # fail with "error in libcrypto") and guarantee a trailing newline,
          # which OpenSSH also requires after the END line.
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" \
            | tr -d '\r' \
            | sed -e '$a\' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Fail loudly here rather than as an opaque "Permission denied" later.
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY is not a valid OpenSSH private key."
            echo "Checks:"
            echo "  1. It must be the PRIVATE key (the file with no .pub), not the public one."
            echo "  2. Paste the WHOLE file, including the"
            echo "     -----BEGIN OPENSSH PRIVATE KEY----- and -----END ...----- lines."
            echo "  3. Generate it with an empty passphrase: ssh-keygen -t ed25519 -N \"\" -f key"
            echo "     (an encrypted key cannot be used unattended by CI)."
            echo "Secret currently holds $(wc -l < ~/.ssh/id_deploy) lines; a valid"
            echo "ed25519 key is ~7 lines and starts with -----BEGIN OPENSSH PRIVATE KEY-----."
            head -c 40 ~/.ssh/id_deploy | sed 's/^/First 40 chars: /'
            exit 1
          fi
          echo "Private key parsed OK."
          echo "--- public half derived from SSH_PRIVATE_KEY ---"
          ssh-keygen -y -f ~/.ssh/id_deploy
          echo "--- fingerprint ---"
          ssh-keygen -lf ~/.ssh/id_deploy
          echo "-----------------------------------------------"
          echo "That public line must be in ~/.ssh/authorized_keys on the server."
          echo "Compare fingerprints server-side with:"
          echo "  ssh-keygen -lf ~/.ssh/authorized_keys"
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            # Preferred: pinned host key, immune to MITM on first connect.
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            # Fallback: trust-on-first-use. Set the SSH_KNOWN_HOSTS secret to harden.
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            # Never fall back to an interactive password prompt — in CI that
            # just prints "Permission denied, please try again." and stalls.
            BatchMode yes
            PreferredAuthentications publickey
          EOF

      - name: Verify SSH connectivity
        run: |
          # -v surfaces which key was offered and how the server answered.
          if ! ssh -v target "echo connected as \$(whoami) on \$(hostname)" 2>&1 | sed 's/^/  /'; then
            echo "::error::Server rejected the deploy key."
            echo "The key is valid locally (previous step parsed it), so this is server-side."
            echo "On the server, as the ${{ secrets.SSH_USER }} user, check:"
            echo "  1. The public key printed above is present verbatim:"
            echo "       grep -c 'ssh-ed25519' ~/.ssh/authorized_keys"
            echo "     Fingerprints must match: ssh-keygen -lf ~/.ssh/authorized_keys"
            echo "  2. Permissions — sshd silently ignores authorized_keys otherwise:"
            echo "       chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys"
            echo "       chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} ~/.ssh"
            echo "  3. The key is on the RIGHT user's account (\$HOME of ${{ secrets.SSH_USER }},"
            echo "     not root) — this is the most common cause."
            echo "  4. sshd allows it:  sudo sshd -T | grep -E 'pubkeyauthentication|allowusers'"
            echo "     then:            sudo tail -50 /var/log/auth.log"
            exit 1
          fi

      - name: Ship compose file to server
        run: |
          ssh target "mkdir -p '$APP_DIR'"
          scp docker-compose.prod.yml target:"$APP_DIR/docker-compose.prod.yml"

      - name: Log the server in to GHCR
        # Token goes over stdin, never argv — it stays out of the server's process list.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh target \
            "docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin"

      - name: Pull and restart
        run: |
          ssh target bash -euo pipefail -s <<EOF
            cd '$APP_DIR'
            export IMAGE_TAG='${{ github.sha }}'
            export IMAGE_BASE='${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}'

            # Persist the tag so a manual 'docker compose up' later reuses this exact build.
            grep -q '^IMAGE_TAG=' .env && sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=\$IMAGE_TAG|" .env || echo "IMAGE_TAG=\$IMAGE_TAG" >> .env
            grep -q '^IMAGE_BASE=' .env && sed -i "s|^IMAGE_BASE=.*|IMAGE_BASE=\$IMAGE_BASE|" .env || echo "IMAGE_BASE=\$IMAGE_BASE" >> .env

            docker compose -f docker-compose.prod.yml pull
            # Migrations run automatically in backend/entrypoint.sh before uvicorn starts.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait
          EOF

      - name: Ensure Ollama model is present
        # Idempotent: a no-op once the model is on the volume.
        run: |
          ssh target bash -euo pipefail -s <<EOF
            cd '$APP_DIR'
            MODEL=\$(grep -E '^OLLAMA_MODEL=' .env | cut -d= -f2- | tr -d '"' || echo 'llama3.2:1b')
            docker compose -f docker-compose.prod.yml exec -T ollama ollama pull "\$MODEL"
          EOF

      - name: Smoke test
        run: |
          ssh target "curl -fsS --retry 5 --retry-delay 5 --retry-all-errors http://localhost/health"

      - name: Prune old images
        # Only after a successful deploy — running this on a failed run just
        # produced a second, misleading SSH error.
        if: success()
        run: ssh target "docker image prune -f --filter 'until=168h'"