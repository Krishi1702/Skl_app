server {
    listen 80;
    server_name _;

    # Docker's internal DNS — re-resolve hostnames every 30s
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Allow large uploads (PDF lessons + audio recordings)
    client_max_body_size 60M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Backend API & WebSocket ─────────────────────────────────────────────
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket upgrade for /api/v1/ws
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Health Check ────────────────────────────────────────────────────────
    location /health {
        set $backend http://backend:8000;
        proxy_pass $backend/health;
    }

    # ── MinIO object storage (presigned PDF / audio URLs) ───────────────────
    # Bucket is "lessons" and keys start with "lessons/", so every object URL
    # is /lessons/lessons/<section>/<uuid>.pdf — never collides with the
    # frontend's /student/lessons or /teacher/lessons pages.
    location /lessons/ {
        set $minio http://minio:9000;
        proxy_pass         $minio;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Stream large files straight through instead of buffering to disk
        proxy_buffering         off;
        proxy_request_buffering off;
    }

    # ── Frontend (Next.js) ──────────────────────────────────────────────────
    location / {
        set $frontend http://frontend:3000;
        proxy_pass         $frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Next.js HMR WebSocket (dev)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
